# ============================================================
# Gyrex Labs — Production Nginx Configuration
# Domains: labs.gyrex.in, admin-labs.gyrex.in
# Dedicated Node.js Port: 3005
# ============================================================

upstream gyrex_labs_upstream {
    server 127.0.0.1:3005;
    keepalive 32;
}

# ------------------------------------------------------------
# 1. HTTP -> HTTPS Redirect for All Gyrex Labs Domains
# ------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name labs.gyrex.in admin-labs.gyrex.in;

    # Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------
# 2. HTTPS Server Block: Patient Storefront (labs.gyrex.in)
# ------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name labs.gyrex.in;

    # SSL Certificates (Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/labs.gyrex.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/labs.gyrex.in/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/labs.gyrex.in/chain.pem;

    # Modern SSL Security Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Upload size allowance for prescription images and diagnostic PDF reports
    client_max_body_size 25M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Dedicated Access & Error Logs
    access_log /var/log/nginx/gyrex_labs_access.log;
    error_log /var/log/nginx/gyrex_labs_error.log warn;

    # Static Assets & Next.js cache optimization
    location /_next/static/ {
        proxy_pass http://gyrex_labs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Proxy to Gyrex Labs Node.js Application
    location / {
        proxy_pass http://gyrex_labs_upstream;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket Support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}

# ------------------------------------------------------------
# 3. HTTPS Server Block: Superadmin Portal (admin-labs.gyrex.in)
# ------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin-labs.gyrex.in;

    # SSL Certificates (Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/admin-labs.gyrex.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin-labs.gyrex.in/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/admin-labs.gyrex.in/chain.pem;

    # Modern SSL Security Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Upload size allowance
    client_max_body_size 25M;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Dedicated Access & Error Logs
    access_log /var/log/nginx/gyrex_admin_labs_access.log;
    error_log /var/log/nginx/gyrex_admin_labs_error.log warn;

    # Proxy to Gyrex Labs Node.js Application
    location / {
        proxy_pass http://gyrex_labs_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
